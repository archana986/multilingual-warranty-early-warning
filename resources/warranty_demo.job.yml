resources:
  jobs:
    warranty_model_evaluation:
      name: ${bundle.target}-multilingual-warranty-model-evaluation
      description: Compares a Databricks-managed embedding model with a self-hosted model on the same labeled multilingual claims.
      tags:
        workload: multilingual_model_evaluation
        data_classification: synthetic
      tasks:
        - task_key: compare_embeddings
          notebook_task:
            notebook_path: ../src/notebooks/multilingual_warranty_qwen3_vs_labse.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
