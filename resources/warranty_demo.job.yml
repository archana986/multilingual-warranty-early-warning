resources:
  jobs:
    warranty_embedding_demo:
      name: ${bundle.target}-multilingual-warranty-embedding-demo
      description: Runs the base comparison and its Day-2 monitoring workflow.
      tags:
        pipeline: multilingual_warranty_embed
        data_classification: synthetic
      tasks:
        - task_key: compare_embeddings
          notebook_task:
            notebook_path: ../src/notebooks/multilingual_warranty_qwen3_vs_labse.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: monitor_embeddings
          depends_on:
            - task_key: compare_embeddings
          notebook_task:
            notebook_path: ../src/notebooks/05_monitoring_and_aiops.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
